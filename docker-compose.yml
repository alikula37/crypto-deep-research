name: crypto-deep-research

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-deep-research:latest
    container_name: cdr-app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CDR_DATA_DIR: /data
      HF_HOME: /data/hf
      FASTEMBED_CACHE_PATH: /data/fastembed
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
