name: crypto-deep-research

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-deep-research:latest
    container_name: cdr-app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Rapor/promptlar macOS ile paylasilir; SQLite + vektor deposu konteyner ici
      # kalici birimde tutulur (WAL modu sanal disk paylasiminda guvenli degildir).
      CDR_DATA_DIR: /data
      CDR_STATE_DIR: /state
      HF_HOME: /state/hf
      FASTEMBED_CACHE_PATH: /state/fastembed
    volumes:
      - cdr-state:/state
      - ./data/reports:/data/reports
      - ./data/prompts:/data/prompts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  cdr-state:
