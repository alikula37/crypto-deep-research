[project]
name = "crypto-deep-research"
version = "0.1.0"
description = "Kripto paralar icin yerel RAG + 66 maddelik deep research ve context yonetim sistemi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "alikula37" }]
keywords = ["crypto", "rag", "research", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "feedparser>=6.0",
  "vaderSentiment>=3.3",
  "pytrends>=4.9",
  "yfinance>=0.2.40",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "mcp>=1.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "lancedb>=0.13",
  "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
cdr = "crypto_deep_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_deep_research"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["web/node_modules", "web/dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
