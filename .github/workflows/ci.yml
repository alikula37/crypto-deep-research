name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Python 3.11 kurulumu
        run: uv python install 3.11
      - name: Bagimliliklari kur
        run: uv sync --extra dev --python 3.11
      - name: Lint
        run: uv run ruff check src tests
      - name: Testler
        env:
          CDR_EMBEDDINGS_ENABLED: "false"
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bagimliliklari kur
        run: npm ci || npm install
      - name: Birim testleri
        run: npm test
      - name: Derle
        run: npm run build
